<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lighting Installations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #1b1b1b, #2a2a2a, #3a3a3a);
      font-family: 'Poppins', sans-serif;
      color: #f5f5f5;
    }

    h2 {
      color: #ffcc80; /* warm light tone */
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn-primary {
      background-color: #ffcc80;
      border-color: #ffcc80;
      color: #1b1b1b;
      font-weight: 600;
    }

    .btn-primary:hover {
      background-color: #ffb74d;
      border-color: #ffb74d;
      transform: scale(1.05);
      transition: all 0.3s ease;
    }

    .image-box {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      aspect-ratio: 4 / 3;
      background-color: #111;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.45s ease;
    }

    .image-box:hover {
      transform: translateY(-12px);
      box-shadow: 0 20px 45px rgba(0,0,0,0.85);
    }

    .image-box:hover img {
      transform: scale(1.12);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(20, 20, 20, 0.65);
      color: #ffcc80;
      opacity: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 1.05rem;
      letter-spacing: 1.2px;
      text-align: center;
      padding: 12px;
    }

    .image-box:hover .overlay {
      opacity: 1;
    }

    footer {
      text-align: center;
      color: #ffcc80;
      padding: 25px 0;
      border-top: 1px solid rgba(255,255,255,0.15);
      margin-top: 60px;
      font-size: 0.95rem;
    }

    @media (max-width: 768px) {
      .image-box { aspect-ratio: 1 / 1; }
    }
  </style>
</head>

<body>
  <div class="container py-5">
    <h2 class="text-center mb-5 wow animate__animated animate__fadeInDown">
      Lighting Installations
    </h2>

    <div class="row g-4">

      <div class="col-md-4 wow animate__animated animate__fadeInUp">
        <a href="../img/Lighting/Lighting.jpeg" data-lightbox="lighting-gallery">
          <div class="image-box">
            <img src="../img/Lighting/Lighting.jpeg" alt="Ceiling Lighting">
            <div class="overlay"></div>
          </div>
        </a>
      </div>

      <div class="col-md-4 wow animate__animated animate__fadeInUp" data-wow-delay="0.1s">
        <a href="../img/Lighting/Lighting 1.jpeg" data-lightbox="lighting-gallery">
          <div class="image-box">
            <img src="../img/Lighting/Lighting 1.jpeg" alt="Wall Lighting">
            <div class="overlay"></div>
          </div>
        </a>
      </div>

      <div class="col-md-4 wow animate__animated animate__fadeInUp" data-wow-delay="0.2s">
        <a href="../img/Lighting/Lighting 2.jpeg" data-lightbox="lighting-gallery">
          <div class="image-box">
            <img src="../img/Lighting/Lighting 2.jpeg" alt="Ambient Lighting">
            <div class="overlay"></div>
          </div>
        </a>
      </div>

      <div class="col-md-4 wow animate__animated animate__fadeInUp">
        <a href="../img/Lighting/Lighting 3.jpeg" data-lightbox="lighting-gallery">
          <div class="image-box">
            <img src="../img/Lighting/Lighting 3.jpeg" alt="Spot Lighting">
            <div class="overlay"></div>
          </div>
        </a>
      </div>

      <div class="col-md-4 wow animate__animated animate__fadeInUp">
        <a href="../img/Lighting/Lighting 4.jpeg" data-lightbox="lighting-gallery">
          <div class="image-box">
            <img src="../img/Lighting/Lighting 4.jpeg" alt="Chandelier Lighting">
            <div class="overlay"></div>
          </div>
        </a>
      </div>

      <div class="col-md-4 wow animate__animated animate__fadeInUp">
        <a href="../img/Lighting/Lighting 5.jpeg" data-lightbox="lighting-gallery">
          <div class="image-box">
            <img src="../img/Lighting/Lighting 5.jpeg" alt="Architectural Lighting">
            <div class="overlay"></div>
          </div>
        </a>
      </div>

       <div class="col-md-4 wow animate__animated animate__fadeInUp">
        <a href="../img/Lighting/Lighting 6.jpeg" data-lightbox="lighting-gallery">
          <div class="image-box">
            <img src="../img/Lighting/Lighting 6.jpeg" alt="Architectural Lighting">
            <div class="overlay"></div>
          </div>
        </a>
      </div>

      <div class="col-md-4 wow animate__animated animate__fadeInUp">
        <a href="../img/Lighting/Lighting 7.jpeg" data-lightbox="lighting-gallery">
          <div class="image-box">
            <img src="../img/Lighting/Lighting 7.jpeg" alt="Architectural Lighting">
            <div class="overlay"></div>
          </div>
        </a>
      </div>

    </div>

    <div class="text-center mt-5 wow animate__animated animate__fadeInUp">
      <a href="../index.html#project" class="btn btn-primary btn-lg shadow-lg">
        Back to Projects
      </a>
    </div>
  </div>

  <footer class="wow animate__animated animate__fadeIn">
    © 2026 Classical Boma Interiors. Professional Lighting Installations.
  </footer>

  <script>new WOW().init();</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
