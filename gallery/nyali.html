<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nyali Site Visits</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* ===== BACKGROUND ===== */
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298, #00c6ff);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite, fadeIn 0.8s ease forwards;
      color: #fff;
      opacity: 0;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ===== TITLE ===== */
    h2 {
      font-weight: 700;
      margin: 30px 0;
    }

    /* ===== BACK BUTTON ===== */
    .back-btn {
      display: inline-block;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      padding: 10px 20px;
      border-radius: 30px;
      transition: 0.3s ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    /* =========================
       UNIFORM GRID (FIXED)
    ========================= */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    /* ===== CARD ===== */
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(8px);

      height: 250px; /* FIXED HEIGHT */

      opacity: 0;
      transform: translateY(40px);
      transition: 0.5s ease;
    }

    /* ===== IMAGE ===== */
    .gallery-img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* KEY FIX */
      cursor: pointer;
      transition: 0.5s ease;
    }

    /* HOVER EFFECT */
    .gallery-item:hover .gallery-img {
      transform: scale(1.08);
      filter: brightness(0.85);
    }

    /* ===== OVERLAY ===== */
    .gallery-overlay {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      transition: 0.3s ease;
    }

    .gallery-item:hover .gallery-overlay {
      opacity: 1;
    }

    /* ===== LIGHTBOX ===== */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }

    .lightbox.active {
      display: flex;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- BACK BUTTON -->
  <a href="/index.html" class="back-btn">← Back</a>

  <h2 class="text-center">Nyali Site Visits</h2>

  <!-- GALLERY -->
  <div class="gallery">

    <div class="gallery-item">
      <img src="/img/Site Visit/Nyali-site/Nyali-site.jpeg" class="gallery-img">
      <div class="gallery-overlay">Nyali Project</div>
    </div>

    <div class="gallery-item">
      <img src="/img/Kitchen Cabinates/Nyali/Nyali-cabinates.jpeg" class="gallery-img">
      <div class="gallery-overlay">Kitchen Cabinets</div>
    </div>

    <div class="gallery-item">
      <img src="/img/Site Visit/Nyali-site/Nyali-site2.jpeg" class="gallery-img">
      <div class="gallery-overlay">Site Visit</div>
    </div>

    <div class="gallery-item">
      <img src="/img/Tv Stand/Nyali/Nyali-tv-stand.jpeg" class="gallery-img">
      <div class="gallery-overlay">Nyali Tv Stand</div>
    </div>

    <div class="gallery-item">
      <img src="/img/Kitchen Cabinates/Nyali/Nyali-cabinates1.jpeg" class="gallery-img">
      <div class="gallery-overlay">Interior Work</div>
    </div>

    <div class="gallery-item">
      <img src="/img/Kitchen Cabinates/Nyali/Nyali-cabinates2.jpeg" class="gallery-img">
      <div class="gallery-overlay">Nyali Cabinates</div>
    </div>

    <div class="gallery-item">
      <img src="/img/Tv Stand/Nyali/Nyali-tv-stand.jpeg" class="gallery-img">
      <div class="gallery-overlay">Nyali Tv Stand</div>
    </div>

    <div class="gallery-item">
      <img src="/img/Tv Stand/Nyali/Nyali-tv-stand3.jpeg" class="gallery-img">
      <div class="gallery-overlay">Nyali Tv Stand</div>
    </div>

    <div class="gallery-item">
      <img src="/img/Kitchen Cabinates/Nyali/Nyali-cabinates3.jpeg" class="gallery-img">
      <div class="gallery-overlay">Nyali Cabinates</div>
    </div>

    <div class="gallery-item">
      <img src="/img/Kitchen Cabinates/Nyali/Nyali-cabinates4.jpeg" class="gallery-img">
      <div class="gallery-overlay">Nyali Cabinates</div>
    </div>

    <div class="gallery-item">
      <img src="/img/Kitchen Cabinates/Nyali/Nyali-cabinates5.jpeg" class="gallery-img">
      <div class="gallery-overlay">Nyali Cabinates</div>
    </div>

    <div class="gallery-item">
      <img src="/img/Tv Stand/Nyali/Nyali-tv-stand4.jpeg" class="gallery-img">
      <div class="gallery-overlay">Nyali TV - Stand</div>
    </div>

    <div class="gallery-item">
      <img src="/img/Kitchen Cabinates/Nyali/Nyali-cabinates9.jpeg" class="gallery-img">
      <div class="gallery-overlay">Nyali Modern Kitchen</div>
    </div>

    <div class="gallery-item">
      <img src="/img/Tv Stand/Nyali/Nyali-tv-stand7.jpeg" class="gallery-img">
      <div class="gallery-overlay">Nyali TV - Stand</div>
    </div>

    <div class="gallery-item">
      <img src="/img/Kitchen Cabinates/Nyali/Nyali-cabinates6.jpeg" class="gallery-img">
      <div class="gallery-overlay">Nyali Modern Kitchen</div>
    </div>

  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <img src="" id="lightbox-img">
</div>

<script>
  const items = document.querySelectorAll(".gallery-item");
  const images = document.querySelectorAll(".gallery-img");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");

  /* SCROLL ANIMATION */
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.style.opacity = 1;
        entry.target.style.transform = "translateY(0)";
      }
    });
  });

  items.forEach(item => observer.observe(item));

  /* LIGHTBOX */
  images.forEach(img => {
    img.addEventListener("click", () => {
      lightbox.classList.add("active");
      lightboxImg.src = img.src;
    });
  });

  lightbox.addEventListener("click", () => {
    lightbox.classList.remove("active");
  });
</script>

</body>
</html>
