  <style>
    body {
      background: linear-gradient(135deg, #1a1625, #2e2252, #5c4b8a);
      font-family: 'Poppins', sans-serif;
      color: #e0dff3;
    }

    h2 {
      color: #b8a8ff;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-primary {
      background-color: #6f63b6;
      border-color: #6f63b6;
    }

    .btn-primary:hover {
      background-color: #8e80ff;
      border-color: #8e80ff;
      transform: scale(1.05);
      transition: all 0.3s ease-in-out;
    }

    .image-box {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      aspect-ratio: 4 / 3;
      background-color: #2b2340;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease-in-out;
    }

    .image-box:hover {
      transform: translateY(-10px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    .image-box:hover img {
      transform: scale(1.1);
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(20, 10, 40, 0.7);
      color: #d1c6ff;
      opacity: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .image-box:hover .overlay {
      opacity: 1;
    }

    footer {
      text-align: center;
      color: #b8a8ff;
      padding: 25px 0;
      border-top: 1px solid rgba(255,255,255,0.2);
      margin-top: 60px;
      font-size: 0.95rem;
    }

    @media (max-width: 768px) {
      .image-box { aspect-ratio: 1 / 1; }
    }
  </style>
</head>
