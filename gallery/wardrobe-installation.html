.horizontal-gallery {

.horizontal-gallery a {

.image-box {

}

.image-box img {

  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

.image-box:hover img {
  transform: scale(1.05);
}

.image-box:hover {
  transform: translateY(-6px);
}

.btn-primary {

  color: #ffffff;
  border: none;

  border-radius: 4px;
  padding: 12px 30px;

  font-size: 0.9rem;
  transition: all 0.3s;
}

.btn-primary:hover {
  background-color: #2b6cb0;
  transform: translateY(-2px);

footer {
