<style>
body {
  background: linear-gradient(135deg, #001f3f, #0074D9, #39CCCC);
  color: #e6f7ff;
  font-family: 'Poppins', sans-serif;
}

h2 { 
  color: #7FDBFF; 
}

/* ===== GRID GALLERY ===== */
.horizontal-gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 20px;
}

/* Tablet */
@media (max-width: 768px) {
  .horizontal-gallery {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Phone */
@media (max-width: 480px) {
  .horizontal-gallery {
    grid-template-columns: 1fr;
  }
}

.image-box {
  position: relative;
  overflow: hidden;
  border-radius: 14px;
  height: 220px;
  transition: transform 0.3s ease;
}

.image-box:hover {
  transform: scale(1.05);
}

.image-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Overlay */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,20,40,0.7);
  color: #7FDBFF;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: bold;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.image-box:hover .overlay { 
  opacity: 1; 
}

/* Button */
.btn-primary {
  background-color: #0074D9;
  border: none;
}

footer {
  text-align: center;
  padding: 20px;
  color: #7FDBFF;
}
</style>
</head>
