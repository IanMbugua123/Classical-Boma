<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wardrobe Lighting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #0f0f1a, #1b1b3a, #2a1f5c);
      font-family: 'Poppins', sans-serif;
      color: #e0dff3;
    }

    h2 {
      color: #9f7aea;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn-primary {
      background-color: #6f63b6;
      border-color: #6f63b6;
    }

    .btn-primary:hover {
      background-color: #8e80ff;
      border-color: #8e80ff;
      transform: scale(1.05);
      transition: all 0.3s ease-in-out;
    }

    .image-box {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      aspect-ratio: 4 / 3;
      background-color: #1b1b3a;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease-in-out;
    }

    .image-box:hover {
      transform: translateY(-10px);
      box-shadow: 0 0 30px rgba(159,122,234,0.8);
    }

    .image-box:hover img {
      transform: scale(1.1);
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 5, 40, 0.7);
      color: #d1c6ff;
      opacity: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .image-box:hover .overlay {
      opacity: 1;
    }

    footer {
      text-align: center;
      color: #b8a8ff;
      padding: 25px 0;
      border-top: 1px solid rgba(255,255,255,0.2);
      margin-top: 60px;
    }

    @media (max-width: 768px) {
      .image-box { aspect-ratio: 1 / 1; }
    }
  </style>
</head>

<body>

<div class="container py-5">
  <h2 class="text-center mb-5 wow animate__animated animate__fadeInDown">
    Wardrobe Lighting Projects
  </h2>

  <div class="row g-4">

    <div class="col-md-4 wow animate__animated animate__fadeInLeft">
      <a href="../img/Wardrobe Lighting/Wardrobe Lighting1.jpeg" data-lightbox="wardrobe-lighting">
        <div class="image-box">
          <img src="../img/Wardrobe Lighting/Wardrobe Lighting1.jpeg" alt="">
          <div class="overlay"></div>
        </div>
      </a>
    </div>

    <div class="col-md-4 wow animate__animated animate__fadeInUp">
      <a href="../img/Wardrobe Lighting/Wardrobe Lighting.jpeg" data-lightbox="wardrobe-lighting">
        <div class="image-box">
          <img src="../img/Wardrobe Lighting/Wardrobe Lighting.jpeg" alt="">
          <div class="overlay"></div>
        </div>
      </a>
    </div>

    

  </div>

  <div class="text-center mt-5">
    <a href="../index.html#project" class="btn btn-primary btn-lg shadow-lg">
      Back to Projects
    </a>
  </div>
</div>

<footer>
  © 2026 Classical Boma Interiors. Illuminating every detail.
</footer>

<script> new WOW().init(); </script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
